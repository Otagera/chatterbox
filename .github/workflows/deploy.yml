name: Deploy

# Test -> build image -> push to GHCR -> tell Coolify to redeploy.
# Coolify pulls the image and runs docker-compose.yml on the VPS.
#
# Required repository secrets:
#   COOLIFY_WEBHOOK_URL - the resource's deploy webhook, e.g.
#                         https://coolify.example.com/api/v1/deploy?uuid=<uuid>
#   COOLIFY_TOKEN       - a Coolify API token (sent as a Bearer token)
#
# Note: GHCR packages are private by default. Either make the package public,
# or add registry credentials for ghcr.io in Coolify so it can pull.
on:
  push:
    branches: [main]
    paths-ignore: ["sdk/**", "**/*.md"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Tests mock the database, so no service containers are needed.
      - run: npx tsc --noEmit
      - run: npm test
        env:
          NODE_ENV: test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase repository path.
      - id: meta
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ghcr.io/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        run: |
          set -euo pipefail
          echo "Deploying ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"
          status=$(curl -sS -o /tmp/coolify.out -w '%{http_code}' \
            -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          echo "Coolify responded $status"
          cat /tmp/coolify.out
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify deploy webhook failed with HTTP $status"
            exit 1
          fi
