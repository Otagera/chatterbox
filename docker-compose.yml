# Chatterbox stack, deployed by Coolify.
#
# Coolify runs this compose file and provides:
#   - the reverse proxy + TLS for your domain (so there is no proxy service here)
#   - environment variables (set them in the Coolify UI, not in a .env file)
#
# The app image is built and pushed to GHCR by .github/workflows/deploy.yml;
# Coolify pulls it. Point the domain at the `app` service on port 3005.
#
# Local testing:
#   APP_IMAGE=chatterbox:local SESSION_SECRET=x ENCRYPTION_KEY=y docker compose up -d

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/otagera/chatterbox:latest}
    restart: unless-stopped
    environment:
      # Tells Coolify which service/port the domain maps to, so its proxy
      # creates a router and requests a TLS certificate for it. Without this a
      # compose deployment has no route for the hostname and the proxy falls
      # back to a self-signed cert (Cloudflare then returns 526).
      SERVICE_FQDN_APP_3005: ${SERVICE_FQDN_APP_3005:-https://chatterbox.otagera.xyz}
      NODE_ENV: production
      PORT: "3005"
      # Internal service names on the compose network.
      DB_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      DB_NAME: ${DB_NAME:-chatterbox}
      # Required — set both in Coolify. Deliberately plain ${VAR} rather than
      # ${VAR:?...}: the :? form hard-fails compose parsing when the variable
      # isn't in scope, which breaks Coolify's own parse of this file (it reads
      # it to build the service list and proxy labels). The app already fails
      # fast on missing values in production, so nothing is lost here.
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Email (Resend)
      PROCESS_EMAILS: ${PROCESS_EMAILS:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_SENDER: ${RESEND_SENDER:-}
      # Queue dashboard at /worker/admin. Job payloads contain OTP codes, so
      # without BOTH of these the dashboard stays disabled in production.
      BULL_BOARD_USER: ${BULL_BOARD_USER:-}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-}
      # Optional: strengthens token/OTP hashes (changing it invalidates existing ones).
      HASH_PEPPER: ${HASH_PEPPER:-}
    # Coolify's proxy routes your domain here; no host ports are published.
    expose:
      - "3005"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  redis-data:
